---
# Updates the Hugo modules (`hugo mod get -u ./...` plus `hugo mod tidy`)
# and commits go.mod/go.sum back.
#
# Complements Renovate, it does not replace it: Renovate raises the versions
# of modules already listed, but does not resolve the module graph anew.
# Newly added transitive modules and the removal of orphaned entries happen
# here only.
name: 'Reusable · Hugo module update'

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main, master]
    # go.mod/go.sum excluded: the workflow's own commit back would start it
    # again otherwise. The second run would find nothing left to do, but it
    # would be a full idle run including the Hugo and Go setup.
    paths-ignore:
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: 'Branch that is pushed back to'
        type: string
        required: false
        default: 'main'
      tidy:
        description: "'false' skips `hugo mod tidy`"
        type: string
        required: false
        default: 'true'
      hugo-version:
        description: 'Hugo version'
        type: string
        required: false
        default: 'latest'

jobs:
  hugo-mod-update:
    runs-on: ubuntu-latest
    steps:
      - name: Update the Hugo modules
        uses: https://git.zyria.de/pyrox/actions/hugo-mod-update@v1
        with:
          # Not the built-in token: the action writes a .netrc and sets
          # GOPRIVATE to fetch Hugo modules. If a module lives in a private
          # repository of the same instance (k3s-prod), a token limited to
          # the running repository is not enough.
          token: ${{ secrets.REGISTRY_TOKEN }}
          branch: ${{ inputs.branch }}
          tidy: ${{ inputs.tidy }}
          hugo-version: ${{ inputs.hugo-version }}
