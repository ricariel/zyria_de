---
name: Publish Site

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master
  # Can be triggered by hand so that a site can be rebuilt without a change
  # of content — the run gate skips every run in which only CI scaffolding
  # changed otherwise.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.zyria.de/pyrox/actions/hugo@v1
        with:
          # Access to this repository: the built-in token of the run. It has
          # to be maintained nowhere and is valid for exactly the
          # repository it runs in — the push into the pages branch needs
          # no more than that.
          token: ${{ secrets.FORGEJO_TOKEN }}
          # Only for Hugo modules from PRIVATE repositories of the same
          # instance (k3s-prod for zyria_de and doc-site). The built-in
          # token does not reach them because it is limited to the running
          # repository. Where neither secret exists the value stays empty
          # and no .netrc is written — public modules need none.
          modules-token: ${{ secrets.REGISTRY_TOKEN }}
