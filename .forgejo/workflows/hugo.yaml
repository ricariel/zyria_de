---
name: Publish Site

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master
  # Manuell ausloesbar, damit sich eine Seite auch ohne Inhaltsaenderung neu
  # bauen laesst — die Lauf-Weiche ueberspringt sonst jeden Lauf, bei dem sich
  # nur CI-Beiwerk geaendert hat.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.zyria.de/pyrox/actions/hugo@v1
        with:
          # Zugriff auf dieses Repository: der eingebaute Token des Laufs.
          # Er muss nirgends gepflegt werden und gilt genau fuer das Repo,
          # in dem er laeuft — mehr braucht der Push in den pages-Branch nicht.
          token: ${{ secrets.FORGEJO_TOKEN }}
          # Nur fuer Hugo-Module aus PRIVATEN Repositories derselben Instanz
          # (k3s-prod bei zyria_de und doc-site). Der eingebaute Token kommt
          # dort nicht heran, weil er auf das laufende Repo beschraenkt ist.
          # Wo keines dieser Secrets existiert, bleibt der Wert leer und es
          # wird keine .netrc geschrieben — oeffentliche Module brauchen keine.
          modules-token: ${{ secrets.REGISTRY_TOKEN }}
