---
name: Publish Site

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master
  # Manuell ausloesbar, damit sich eine Seite auch ohne Inhaltsaenderung neu
  # bauen laesst — die Lauf-Weiche ueberspringt sonst jeden Lauf, bei dem sich
  # nur CI-Beiwerk geaendert hat.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://git.zyria.de/pyrox/actions/hugo@v1
        with:
          # Rueckfallkette, damit die Datei in beiden Instanzen byte-identisch
          # bleibt: in zyria greift ZYRIA_TOKEN, auf CDP gibt es das Secret
          # nicht und es faellt auf REGISTRY_TOKEN durch. Ohne die Kette
          # scheiterte dort jeder Lauf, der tatsaechlich bauen sollte, mit
          # "Input required and not supplied: token".
          ZYRIA_TOKEN: ${{ secrets.ZYRIA_TOKEN || secrets.REGISTRY_TOKEN || secrets.CDP_TOKEN }}
