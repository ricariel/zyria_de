---
name: Mirror

on:
  push:
    branches:
      - main
      - master
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror
        uses: https://git.zyria.de/pyrox/actions/mirror@a38344044e10f21e926de8211be061f5e384db4d # v1
        with:
          target_repo_url: 'git@codeberg.org:ricariel/${{ github.event.repository.name }}.git'
          ssh_private_key: ${{ secrets.ZYRIA_CODEBERG_SSH }}
