---
name: renovate
on:
  schedule:
    - cron: '12 6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run renovate
        uses: https://git.zyria.de/pyrox/actions/renovate@5f00b220bfac7c802703fea31da70df00b2b507e # v1
        with:
          gh-token: ${{ secrets.GITHUB }}
          token: ${{ secrets.RENOVATE_TOKEN }}
