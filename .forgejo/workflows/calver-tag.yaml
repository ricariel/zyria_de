---
# Reusable workflow: create a CalVer tag for the period that has ended
#
# Call in the consumer repository (Mondays 04:00 UTC plus by hand):
#
#   on:
#     schedule:
#       - cron: '0 4 * * 1'
#   jobs:
#     calver-tag:
#       uses: https://git.zyria.de/pyrox/actions/.forgejo/workflows/calver-tag.yaml@v1
#       secrets: inherit
#
# Creates the tag ONLY (plus a dated changelog section). A Forgejo release
# follows from it only if the repository has forgejo-release.yaml AND its
# trigger matches: that one listens for 'v*' and so never matches a CalVer
# tag such as 2026.33. Whoever wants a release from the CalVer tag has to
# widen the trigger there.
name: 'Reusable · CalVer tag'

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      branch:
        description: 'Branch the changelog commit is pushed to'
        type: string
        required: false
        default: 'main'
      tag-format:
        description: 'date(1) format of the tag; default "%G.%V" = YEAR.WEEK'
        type: string
        required: false
        default: '%G.%V'
      date-offset:
        description: 'date(1) offset that determines the period'
        type: string
        required: false
        default: '-1 day'
      update-changelog:
        description: "'true' = write a dated changelog section as well"
        type: string
        required: false
        default: 'true'
      config:
        description: 'Path to the git-cliff config (fallback: default from pyrox/actions)'
        type: string
        required: false
        default: 'cliff.toml'
      output:
        description: 'Changelog file'
        type: string
        required: false
        default: 'CHANGELOG.md'

jobs:
  calver-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create the CalVer tag
        uses: https://git.zyria.de/pyrox/actions/calver-tag@v1
        with:
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.branch }}
          tag-format: ${{ inputs.tag-format }}
          date-offset: ${{ inputs.date-offset }}
          update-changelog: ${{ inputs.update-changelog }}
          config: ${{ inputs.config }}
          output: ${{ inputs.output }}
