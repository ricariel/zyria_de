---
# site.yml der Collection ist ein Playbook, keine Rolle.
- name: Deploy K3s Cluster
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Apply K3s base manifests
  hosts: localhost
  become: true
  remote_user: root
  gather_facts: false
  tasks:
    - name: Apply kustomization for k3s apps
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl kustomize --enable-helm {{ playbook_dir }}/../apps/k3s | kubectl apply -n kube-system -f -
        executable: /bin/bash
      register: apply_result
      changed_when: "'unchanged' not in apply_result.stdout"
