---
k3s_cluster:
  children:
    server:
      hosts:
        control0.zyria.de:
          ansible_host: 192.168.178.150
#        control1.zyria.de:
#          ansible_host: 192.168.178.151
        control2.zyria.de:
          ansible_host: 192.168.178.152
        control3.zyria.de:
          ansible_host: 192.168.178.153
    agent:
      # Agents sprechen die API ueber kubernetes-vip an (MetalLB L2 auf den
      # Control-Nodes, verteilt auf alle API-Server, im Zertifikat enthalten).
      # Die Server bleiben bei 192.168.178.150, weil die VIP beim Aufbau eines
      # neuen Clusters noch nicht existiert. Frueher stand hier nichts, und die
      # Agent-Unit zeigte allein auf control0.
      vars:
        api_endpoint: "192.168.178.29"
      hosts:
        worker1.zyria.de:
          ansible_host: 192.168.178.161
        worker2.zyria.de:
          ansible_host: 192.168.178.162
#        worker3.zyria.de:
#          ansible_host: 192.168.178.163
#        worker4.zyria.de:
#          ansible_host: 192.168.178.164


  # Required Vars
  vars:
    ansible_port: 22
    ansible_user: root
    k3s_version: v1.36.4+k3s1
    token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          37303231303839393633303836613065333935663261333739616666393064336563323731363766
          3862613432663337386635643865623665656365313331640a616531616261656232346433613634
          61633732343565356566383131626234376266636437643235623962303432366631333532363236
          3835616133663539380a616138343632633534376231396437353639626138313034346534393538
          30396666396332613764643265386164613161396561626162326462623630633238623565366430
          62663431396639373736656466303937643063353362336533636335383362616137336134616537
          34373638333833633730333738636330646263343535613739366665313362616662326235363361
          63333865633333663562
    api_endpoint: "192.168.178.150"
    extra_server_args: ""
    extra_agent_args: ""

  # Optional vars
    cluster_context: prod.zyria.de
    # api_port: 6443
    # k3s_server_location: /var/lib/rancher/k3s
    # systemd_dir: /etc/systemd/system
    # extra_service_envs: [ 'ENV_VAR1=VALUE1', 'ENV_VAR2=VALUE2' ]
    # Manifests or Airgap should be either full paths or relative to the playbook directory.
    # List of locally available manifests to apply to the cluster, useful for PVCs or Traefik modifications.
    # extra_manifests: [ '/path/to/manifest1.yaml', '/path/to/manifest2.yaml' ]
    # airgap_dir: /tmp/k3s-airgap-images
    # user_kubectl: true, by default kubectl is symlinked and configured for use by ansible_user. Set to false to only kubectl via root user.
    server_config_yaml: |
      # This is now an inner yaml file. Maintain the indentation.
      # YAML here will be placed as the content of /etc/rancher/k3s/config.yaml
      # See https://docs.k3s.io/installation/configuration#configuration-file
      disable:
        - traefik
        - servicelb
        - coredns
        # Stand im Konflikt mit apps/k3s/local-path.yaml (ArgoCD): jeder
        # Server-Start schrieb eine andere Config und eine zweite
        # Standard-StorageClass zurueck. Wird nicht genutzt, siehe
        # apps/k3s/README.md. Beim Abschalten deinstalliert k3s das Addon.
        - local-storage
      cluster-cidr: 10.44.0.0/16,fd21:da66:909b::/48
      service-cidr: 10.45.0.0/16,fd21:da66:64::/112
      tls-san:
        - "2003:a:b16:4700:be24:11ff:fec8:ae7f"
        - "192.168.178.150"
        - "192.168.178.151"
        - "192.168.178.152"
        - "192.168.178.153"
        - "192.168.178.29"
        - "2003:a:b16:4700::29"
        - "2003:a:b16:4700:be24:11ff:fe63:f371"
      write-kubeconfig-mode: 644
      flannel-ipv6-masq: true
      flannel-backend: wireguard-native
      kubelet-arg:
        - "node-ip=0.0.0.0"
        # Eigene Datei statt /etc/resolv.conf. kubelet baut daraus die
        # resolv.conf jedes Pods mit hostNetwork bzw. dnsPolicy: Default und
        # damit auch die Upstreams des kube-system-CoreDNS
        # (forward . /etc/resolv.conf). Geschrieben wird sie von
        # ansible-main/playbooks/setup_resolver.yml - das Playbook muss vor
        # diesem Deploy gelaufen sein, sonst startet kubelet ohne Upstreams.
        # Grund: kubelet schneidet nach drei Nameservern ab (MaxDNSNameservers)
        # und protokollierte DNSConfigForming, solange die Node-Datei vier
        # Eintraege hatte.
        - "resolv-conf=/etc/kubernetes/resolv.conf"
        # Gestaffelter Pod-Shutdown beim Herunterfahren der Node: erst
        # Workloads, dann Longhorn, dann Systempods. Ohne ihn verloren am
        # 17.09.2026 Datenbanken den Storage, als ein Proxmox-Host per
        # unattended-upgrades neu startete. Geschrieben wird die Datei von
        # ansible-main/playbooks/k3s.yml - das Playbook muss vor diesem Deploy
        # gelaufen sein, sonst startet kubelet nicht.
        - "config=/etc/kubernetes/kubelet-shutdown.yaml"
      kube-proxy-arg:
        - ipvs-strict-arp=true
      embedded-registry: true
      node-name: "{{ inventory_hostname }}"
    # Die Agents hatten bisher keine config.yaml. Sie bekommen jetzt eine -
    # bewusst nur mit dem resolv-conf-Schalter, damit sich an ihrer uebrigen
    # Konfiguration nichts aendert. Der Deploy schreibt die Datei und startet
    # k3s-agent neu.
    agent_config_yaml: |
      # This is now an inner yaml file. Maintain the indentation.
      # YAML here will be placed as the content of /etc/rancher/k3s/config.yaml
      kubelet-arg:
        - "resolv-conf=/etc/kubernetes/resolv.conf"
        # Siehe server_config_yaml.
        - "config=/etc/kubernetes/kubelet-shutdown.yaml"
    registries_config_yaml: |
      mirrors:
        docker.io:
        quay.io:
        ghcr.io:
        gcr.io:
        registry.k8s.io:
        public.ecr.aws:
